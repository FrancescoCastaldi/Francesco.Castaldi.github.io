<!DOCTYPE html>
<html lang="it">
<head>
        <base href="/">
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 – Pagina non trovata | Francesco Castaldi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap"></noscript>
    <link rel="stylesheet" href="assets/css/finance.css?v=2">
    <link rel="icon" href="assets/images/favicon.ico" type="image/x-icon">
    <style>
        .error-container {
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }
        .error-code {
            font-size: 6rem;
            font-family: var(--font-mono, monospace);
            color: var(--accent-orange);
            text-shadow: 0 0 30px rgba(249,115,22,0.3);
            margin-bottom: 1rem;
            animation: errorPulse 3s ease-in-out infinite;
        }

        @keyframes errorPulse {
            0%, 100% { text-shadow: 0 0 20px rgba(249,115,22,0.2); }
            50% { text-shadow: 0 0 40px rgba(249,115,22,0.4); }
        }
        .error-message {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }
        .error-links {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }
    </style>
    <script>
    // ── Redirect map for site restructure ──
    (function() {
      var path = window.location.pathname.replace(/\/$/, '') || '/';

      var redirectMap = {
        // Bikes
        '/bikes/bike-maintenance': '/pages/bikes/bike-maintenance.html',
        '/bikes/giant-tcr': '/pages/bikes/giant-tcr.html',
        '/bikes/giant-tcr-maintenance': '/pages/bikes/giant-tcr-maintenance.html',
        '/bikes/trek-madone': '/pages/bikes/trek-madone.html',
        '/bikes/trek-madone-animazione': '/pages/bikes/trek-madone-animazione.html',

        // Blog
        '/blog/index2': '/pages/blog/index2.html',
        '/blog/sport': '/pages/blog/sport.html',
        '/blog/aerodinamica-casco': '/pages/blog/aerodinamica-casco.html',
        '/blog/allenamento-ciclismo-8-ore': '/pages/blog/allenamento-ciclismo-8-ore.html',
        '/blog/analisi-power-meter-strava': '/pages/blog/analisi-power-meter-strava.html',
        '/blog/app-analisi-performance': '/pages/blog/app-analisi-performance.html',
        '/blog/bike-fitting-aero': '/pages/blog/bike-fitting-aero.html',
        '/blog/caffeina-integrazione': '/pages/blog/caffeina-integrazione.html',
        '/blog/carburi-grassi-endurance': '/pages/blog/carburi-grassi-endurance.html',
        '/blog/diagnosi-rumori': '/pages/blog/diagnosi-rumori.html',
        '/blog/drafting-gruppo': '/pages/blog/drafting-gruppo.html',
        '/blog/ftp-test-protocolli': '/pages/blog/ftp-test-protocolli.html',
        '/blog/gps-garmin-wahoo': '/pages/blog/gps-garmin-wahoo.html',
        '/blog/idratazione-lungo': '/pages/blog/idratazione-lungo.html',
        '/blog/interval-training-vo2max': '/pages/blog/interval-training-vo2max.html',
        '/blog/manutenzione-trasmissione': '/pages/blog/manutenzione-trasmissione.html',
        '/blog/nutrizione-pre-gara': '/pages/blog/nutrizione-pre-gara.html',
        '/blog/piano-allenamento-granfondo': '/pages/blog/piano-allenamento-granfondo.html',
        '/blog/recupero-attivo-passivo': '/pages/blog/recupero-attivo-passivo.html',
        '/blog/regolazione-freni-disco': '/pages/blog/regolazione-freni-disco.html',
        '/blog/salite-piedi-seduti': '/pages/blog/salite-piedi-seduti.html',
        '/blog/scelta-ruote-profili': '/pages/blog/scelta-ruote-profili.html',
        '/blog/setup-tubeless': '/pages/blog/setup-tubeless.html',

        // Fitness
        '/fitness/strava': '/pages/fitness/strava.html',
        '/fitness/gpx-editor': '/pages/fitness/gpx-editor.html',

        // Projects
        '/projects/hospital-sanitization-tracker': '/pages/projects/hospital-sanitization-tracker.html',
        '/projects/sir-markov-chain': '/pages/projects/sir-markov-chain.html',
        '/projects/ci-cervical-lbc': '/pages/projects/ci-cervical-lbc.html',
        '/projects/sgf2-ai-project': '/pages/projects/sgf2-ai-project.html',

        // Personal
        '/personal/contact': '/pages/personal/contact.html',
        '/personal/love': '/pages/personal/love.html'
      };

      // Remove trailing .html or / if present for lookup
      var lookup = path;
      if (lookup.endsWith('.html')) lookup = lookup.slice(0, -5);
      if (lookup.endsWith('/')) lookup = lookup.slice(0, -1);

      // Check exact redirect map
      var dest = redirectMap[lookup];
      if (dest && dest !== path) {
        window.location.replace(dest);
        return;
      }

      // Generic redirect: /photos/* → /assets/images/*
      if (lookup.startsWith('/photos/')) {
        dest = lookup.replace('/photos/', '/assets/images/');
        window.location.replace(dest);
        return;
      }

      // Generic redirect: /bikes/* → /pages/bikes/*.html
      // (catch any bikes/ page not in the explicit map)
      if (lookup.startsWith('/bikes/')) {
        dest = lookup.replace('/bikes/', '/pages/bikes/');
        if (!dest.endsWith('.html')) dest += '.html';
        window.location.replace(dest);
        return;
      }
    })();
    </script>
</head>
<body>
    <header id="site-header"></header>
    <main class="main-content" style="flex:1;">
        <div class="error-container">
            <div class="error-code">404</div>
            <h1>Pagina non trovata</h1>
            <p class="error-message" id="error-msg">La risorsa che stai cercando non esiste o è stata spostata.</p>
            <div class="error-links">
                <a href="index.html" class="btn-primary">🏠 Torna alla home</a>
                <a href="pages/personal/contact.html" class="btn-secondary">✉️ Contattami</a>
            </div>
        </div>
    </main>
    <footer id="site-footer"></footer>
    <canvas id="bg-canvas"></canvas>
    <script src="assets/js/app.js" defer></script>
    <script src="assets/js/enhancements.js" defer></script>
</body>
</html>
